name: Windows x64 test and package
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.19.0
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Test configuration with isolated Windows API mocks
        shell: pwsh
        run: ./tests/test_configure.ps1
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scout/configure.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Package portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DNSScout --add-data "scout/configure.ps1;scout" main.py
      - name: Smoke test packaged UI
        shell: pwsh
        run: |
          $p = Start-Process ./dist/DNSScout.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'EXE smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "EXE failed: $($p.ExitCode)" }
          $hash = (Get-FileHash ./dist/DNSScout.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DNSScout.exe" | Set-Content -Encoding utf8 ./dist/SHA256SUMS.txt
          Copy-Item README.md,LICENSE ./dist/
          Compress-Archive -Path ./dist/DNSScout.exe,./dist/README.md,./dist/LICENSE,./dist/SHA256SUMS.txt -DestinationPath ./dist/DNSScout-win11-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DNSScout-win11-x64
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME ./dist/DNSScout.exe ./dist/DNSScout-win11-x64.zip ./dist/SHA256SUMS.txt --title "DNS Scout $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
